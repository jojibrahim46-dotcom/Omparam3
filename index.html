<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>بطاقة أم سلمة عبدالرحمن</title>
<style>
  :root { color-scheme: dark; --gold:#d9b66d; --gold2:#f6e3a5; --black:#090909; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100svh; padding:24px 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background: radial-gradient(ellipse at 50% 12%, #282116 0%, #11100e 38%, #050505 100%);
    color:#f7f0df; font-family: Tahoma, Arial, sans-serif;
  }
  .business-card {
    position:relative; isolation:isolate; overflow:hidden;
    width:min(100%, 520px); aspect-ratio: 1.72 / 1; min-height:230px;
    border:1px solid rgba(230,194,112,.8); border-radius:20px;
    padding:clamp(22px, 5.5vw, 38px);
    display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(135deg,#191713 0%,#080808 45%,#211b10 100%);
    box-shadow:0 24px 65px rgba(0,0,0,.55), inset 0 0 0 5px rgba(217,182,109,.07), inset 0 0 35px rgba(217,182,109,.06);
  }
  .business-card::before {
    content:""; position:absolute; z-index:-1; width:245px; height:245px; border-radius:50%;
    border:1px solid rgba(217,182,109,.24); top:-110px; left:-70px;
    box-shadow:0 0 0 15px rgba(217,182,109,.035),0 0 0 32px rgba(217,182,109,.025),0 0 0 52px rgba(217,182,109,.018);
  }
  .business-card::after {
    content:""; position:absolute; z-index:-1; right:0; bottom:0; width:100%; height:4px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);
  }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .monogram {
    width:48px; height:48px; border:1px solid var(--gold); border-radius:50%;
    display:grid; place-items:center; color:var(--gold2); font-family:Georgia,serif;
    font-size:24px; box-shadow:0 0 20px rgba(217,182,109,.12);
  }
  .brand { color:var(--gold); font-size:10px; letter-spacing:3px; direction:ltr; }
  .name { margin:14px 0 8px; font-size:clamp(23px, 5.5vw, 35px); font-weight:700; line-height:1.35; color:#fff7e4; }
  .rule { width:70px; height:2px; background:linear-gradient(90deg,var(--gold2),transparent); margin:13px 0 18px auto; }
  .contact { display:flex; align-items:center; gap:10px; direction:ltr; justify-content:flex-start; color:var(--gold2); font-size:clamp(14px,3.5vw,17px); letter-spacing:.4px; }
  .phone-icon { width:30px; height:30px; display:grid; place-items:center; border:1px solid rgba(217,182,109,.55); border-radius:50%; flex-shrink:0; }
  .footer { display:flex; justify-content:space-between; align-items:end; gap:12px; margin-top:16px; }
  .tagline { color:#b8ad96; font-size:10px; letter-spacing:2px; }
  .ornament { color:var(--gold); font-size:21px; }
  .actions { width:min(100%,520px); display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn {
    min-height:52px; border-radius:12px; border:1px solid var(--gold); padding:13px 12px;
    display:flex; justify-content:center; align-items:center; gap:9px; text-decoration:none;
    font:600 15px Tahoma,Arial,sans-serif; cursor:pointer; transition:transform .18s,filter .18s;
  }
  .btn:active { transform:scale(.98); }
  .save { color:#17120a; background:linear-gradient(135deg,var(--gold2),var(--gold)); }
  .whatsapp { color:var(--gold2); background:rgba(10,10,10,.65); }
  .btn svg { width:20px; height:20px; flex-shrink:0; }
  .note { width:min(100%,520px); color:#8f8879; text-align:center; font-size:11px; line-height:1.7; margin:0; }
  @media (max-width:360px) {
    body { padding:16px 10px; }
    .business-card { min-height:220px; padding:20px; border-radius:16px; }
    .actions { grid-template-columns:1fr; }
    .footer { margin-top:10px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
  <main class="business-card" aria-label="بطاقة اتصال أم سلمة عبدالرحمن">
    <div class="topline">
      <div class="monogram" aria-hidden="true">أ</div>
      <div class="brand">PERSONAL CONTACT</div>
    </div>
    <div>
      <div class="name">أم سلمة عبدالرحمن</div>
      <div class="rule"></div>
      <div class="contact">
        <span class="phone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h3l2 5-2 1.5a15 15 0 0 0 4.5 4.5L16 12l5 2v3c0 1.1-.9 2-2 2C10 19 5 14 5 5c0-1.1.9-2 2-2Z"/></svg>
        </span>
        <span>+249 912 481 870</span>
      </div>
    </div>
    <div class="footer">
      <span class="tagline">ELEGANCE • CONNECTION</span>
      <span class="ornament" aria-hidden="true">✦</span>
    </div>
  </main>

  <section class="actions" aria-label="خيارات الاتصال">
    <button class="btn save" id="saveContact" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 8 5 5 5-5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      حفظ جهة الاتصال
    </button>
    <a class="btn whatsapp" href="https://wa.me/249912481870" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.7A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8.8 8.2c.3-.6.6-.6.9-.6h.5c.2 0 .4.1.5.4l.8 1.8c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4 0 .7.5.9 1.3 1.7 2.2 2.2.3.2.5.2.7 0l.8-.9c.2-.2.4-.2.6-.1l1.7.8c.3.1.4.3.4.5 0 .3-.2 1.1-.7 1.5-.5.5-1.2.7-1.8.6-1-.2-2.2-.7-3.5-1.9-1.4-1.3-2.2-2.8-2.4-3.8-.2-.8.1-1.6.5-2.1Z"/></svg>
      مراسلة واتساب
    </a>
  </section>
  <p class="note">بطاقة رقمية متجاوبة مع الهواتف والأجهزة اللوحية والحاسوب. اضغط «حفظ جهة الاتصال» لتنزيل ملف جهة الاتصال بصيغة VCF.</p>

<script>
  document.getElementById('saveContact').addEventListener('click', function () {
    const vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'FN:أم سلمة عبدالرحمن',
      'N:عبدالرحمن;أم سلمة;;;',
      'TEL;TYPE=CELL,VOICE:+249912481870',
      'END:VCARD'
    ].join('\r\n') + '\r\n';
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'ام-سلمة-عبدالرحمن.vcf';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
</script>
</body>
</html>
